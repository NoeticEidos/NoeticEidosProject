version: '3.8'

services:
  policy-service:
    build: 
      context: .
      target: production
    container_name: mock-policy-service
    ports:
      - "50051:50051"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - SERVICE_NAME=mock-policy-service
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e 'console.log(\"Health check\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  policy-service-dev:
    build:
      context: .
      target: development
    container_name: mock-policy-service-dev
    ports:
      - "50052:50051"
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - SERVICE_NAME=mock-policy-service-dev
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    command: ["nodemon", "server.js"]
    profiles:
      - dev

  # Optional: Add monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    profiles:
      - monitoring

volumes:
  grafana-data:

networks:
  default:
    name: policy-service-network