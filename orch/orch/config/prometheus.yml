# Prometheus configuration for Mock Policy Service monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'policy-service'
    static_configs:
      - targets: ['policy-service:50051']
    scrape_interval: 10s
    metrics_path: /metrics
    
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Add additional monitoring targets
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093